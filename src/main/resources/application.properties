spring.application.name=TripTogether

server.servlet.context-path=/TripTogether

# SSE \uB4F1 \uC7A5\uC2DC\uAC04 \uCEE4\uB125\uC158 \uB300\uBE44 Tomcat \uC2A4\uB808\uB4DC \uD655\uC7A5
server.tomcat.threads.max=500

# mysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/team1_db?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
spring.datasource.username=dbuser
spring.datasource.password=YOUR_DB_PASSWORD

# mybatis
mybatis.mapper-locations=classpath:mapper/*.xml
# MyBatis \uD0C0\uC785 \uBCC4\uCE6D\uC740 \uC2E4\uC81C VO \uD328\uD0A4\uC9C0\uB9CC \uBA85\uC2DC\uD55C\uB2E4.
# \uC640\uC77C\uB4DC\uCE74\uB4DC + \uB300\uC18C\uBB38\uC790 \uC624\uD0C0 \uC870\uD569\uC740 Linux \uD658\uACBD\uC5D0\uC11C \uC2A4\uCE94 \uB204\uB77D/\uCDA9\uB3CC\uC758 \uC6D0\uC778\uC774 \uB418\uAE30 \uC27D\uB2E4.
mybatis.type-aliases-package=org.triptogether.admin.vo,org.triptogether.assistant.vo,org.triptogether.auth.vo,org.triptogether.common.vo,org.triptogether.community.vo,org.triptogether.courses.vo,org.triptogether.detail.vo,org.triptogether.explore.vo,org.triptogether.home.vo,org.triptogether.myPage.vo,org.triptogether.inquiry.vo,org.triptogether.moderation.vo,org.triptogether.report.vo,org.triptogether.superAdmin.vo,org.triptogether.travelPackage.vo

# JSP MVC
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

#
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true

# \uD30C\uC77C \uCC98\uB9AC
# \uD30C\uC77C 1\uAC1C\uC758 \uCD5C\uB300\uD06C\uAE30
spring.servlet.multipart.max-file-size=10MB
# \uC694\uCCAD \uC804\uCCB4 \uCD5C\uB300 \uD06C\uAE30
spring.servlet.multipart.max-request-size=100MB
# \uC5C5\uB85C\uB4DC \uC800\uC7A5 \uC704\uCE58
file.upload.path=src/main/resources/upload/

# \u2500\u2500 Kakao Auth \u2500\u2500
oauth.kakao.client-id=YOUR_OAUTH_KAKAO_CLIENT_ID
oauth.kakao.client-secret=YOUR_OAUTH_KAKAO_CLIENT_SECRET
oauth.kakao.redirect-uri=http://localhost:8080/TripTogether/auth/kakao/callback
oauth.kakao.link-redirect-uri=http://localhost:8080/TripTogether/auth/link/kakao/callback
oauth.kakao.logout-redirect-uri=http://localhost:8080/TripTogether/auth/kakao/logout/callback

# \u2500\u2500 Naver Auth \u2500\u2500
oauth.naver.client-id=YOUR_OAUTH_NAVER_CLIENT_ID
oauth.naver.client-secret=YOUR_OAUTH_NAVER_CLIENT_SECRET
oauth.naver.redirect-uri=http://localhost:8080/TripTogether/auth/naver/callback
oauth.naver.link-redirect-uri=http://localhost:8080/TripTogether/auth/link/naver/callback
oauth.naver.logout-redirect-uri=http://localhost:8080/TripTogether/auth/naver/logout/callback

# \u2500\u2500 Google Auth \u2500\u2500
oauth.google.client-id=YOUR_OAUTH_GOOGLE_CLIENT_ID
oauth.google.client-secret=YOUR_OAUTH_GOOGLE_CLIENT_SECRET
oauth.google.redirect-uri=http://localhost:8080/TripTogether/auth/google/callback
oauth.google.link-redirect-uri=http://localhost:8080/TripTogether/auth/link/google/callback
oauth.google.logout-redirect-uri=http://localhost:8080/TripTogether/auth/google/logout/callback
# \u2500\u2500 Google Maps \u2500\u2500
google.maps.api-key=YOUR_GOOGLE_MAPS_API_KEY
# \u2500\u2500 Google Gemini \u2500\u2500
gemini.api.key=YOUR_GEMINI_API_KEY
# \u2500\u2500 Claude AI API \u2500\u2500
claude.api.key=YOUR_CLAUDE_API_KEY
gcp.translate.api.key=YOUR_GCP_TRANSLATE_API_KEY
openai.api.key=YOUR_OPENAI_API_KEY
openai.model=gpt-4o-mini

# \uC571 \uAE30\uBCF8 URL (\uC774\uBA54\uC77C \uB9C1\uD06C \uC0DD\uC131\uC5D0 \uC0AC\uC6A9)
app.base-url=http://localhost:8080/TripTogether

# Toss Payments (test mode)
toss.payments.client-key=YOUR_TOSS_PAYMENTS_CLIENT_KEY
toss.payments.secret-key=YOUR_TOSS_PAYMENTS_SECRET_KEY

# \u2500\u2500 Naver SMTP \u2500\u2500
spring.mail.host=smtp.naver.com
spring.mail.port=465
spring.mail.username=your-email@example.com
spring.mail.password=YOUR_SPRING_MAIL_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.naver.com
mail.sender.name=TripTogether


# Victor
pixabay.api.key=YOUR_PIXABAY_API_KEY
perspective.api.key=YOUR_PERSPECTIVE_API_KEY
cloudinary.cloud-name=dpwkbo5lk
cloudinary.api-key=YOUR_CLOUDINARY_API_KEY
cloudinary.api-secret=YOUR_CLOUDINARY_API_SECRET
inquiry.claude.api.key=YOUR_INQUIRY_CLAUDE_API_KEY
