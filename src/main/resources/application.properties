spring.application.name=TripTogether

server.servlet.context-path=/TripTogether

# mysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/team1_db?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
spring.datasource.username=dbuser
spring.datasource.password=YOUR_DB_PASSWORD

# mybatis
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=org.study.TravelProject.*.vo

# JSP MVC
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

#
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true

# \uD30C\uC77C \uCC98\uB9AC
# \uD30C\uC77C 1\uAC1C\uC758 \uCD5C\uB300\uD06C\uAE30
spring.servlet.multipart.max-file-size=10MB
# \uC694\uCCAD \uC804\uCCB4 \uCD5C\uB300 \uD06C\uAE30
spring.servlet.multipart.max-request-size=10MB
# \uC5C5\uB85C\uB4DC \uC800\uC7A5 \uC704\uCE58
file.upload.path=src/main/resources/upload/

# \uC571 \uAE30\uBCF8 URL (\uC774\uBA54\uC77C \uB9C1\uD06C \uC0DD\uC131\uC5D0 \uC0AC\uC6A9)
app.base-url=http://localhost:8080/TripTogether

# \u2500\u2500 Gmail SMTP \u2500\u2500
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

# \u2500\u2500 \uC18C\uC15C \uB85C\uADF8\uC778\uC6A9 redirect-uri (\uB85C\uADF8\uC778 \uBAA8\uB4DC) \u2500\u2500
oauth.kakao.client-id=YOUR_KAKAO_REST_API_KEY
oauth.kakao.client-secret=YOUR_KAKAO_CLIENT_SECRET
oauth.kakao.redirect-uri=http://localhost:8080/TripTogether/auth/kakao/callback

oauth.naver.client-id=YOUR_NAVER_CLIENT_ID
oauth.naver.client-secret=YOUR_NAVER_CLIENT_SECRET
oauth.naver.redirect-uri=http://localhost:8080/TripTogether/auth/naver/callback

oauth.google.client-id=YOUR_GOOGLE_CLIENT_ID
oauth.google.client-secret=YOUR_GOOGLE_CLIENT_SECRET
oauth.google.redirect-uri=http://localhost:8080/TripTogether/auth/google/callback

# \u2500\u2500 \uC18C\uC15C \uC5F0\uB3D9\uC6A9 redirect-uri (\uC5F0\uB3D9 \uBAA8\uB4DC, \uAC01 \uC18C\uC15C \uC571 \uC124\uC815\uC5D0\uB3C4 \uCD94\uAC00 \uD544\uC694) \u2500\u2500
oauth.kakao.link-redirect-uri=http://localhost:8080/TripTogether/auth/link/kakao/callback
oauth.naver.link-redirect-uri=http://localhost:8080/TripTogether/auth/link/naver/callback
oauth.google.link-redirect-uri=http://localhost:8080/TripTogether/auth/link/google/callback

#  Claude AI API
claude.api.key=YOUR_CLAUDE_API_KEY