spring.application.name=TripTogether

server.servlet.context-path=/TripTogether

# mysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/team1_db?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
spring.datasource.username=dbuser
spring.datasource.password=YOUR_DB_PASSWORD

# mybatis
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=org.study.TravelProject.*.vo

# JSP MVC
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

#
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true

# \uD30C\uC77C \uCC98\uB9AC
# \uD30C\uC77C 1\uAC1C\uC758 \uCD5C\uB300\uD06C\uAE30
spring.servlet.multipart.max-file-size=10MB
# \uC694\uCCAD \uC804\uCCB4 \uCD5C\uB300 \uD06C\uAE30
spring.servlet.multipart.max-request-size=100MB
# \uC5C5\uB85C\uB4DC \uC800\uC7A5 \uC704\uCE58
file.upload.path=src/main/resources/upload/

# \u2500\u2500 Kakao OAuth2 \u2500\u2500
oauth.kakao.client-id=YOUR_KAKAO_REST_API_KEY
oauth.kakao.client-secret=YOUR_KAKAO_CLIENT_SECRET
oauth.kakao.redirect-uri=http://localhost:8080/TripTogether/auth/kakao/callback

# \u2500\u2500 Naver OAuth2 \u2500\u2500
oauth.naver.client-id=YOUR_NAVER_CLIENT_ID
oauth.naver.client-secret=YOUR_NAVER_CLIENT_SECRET
oauth.naver.redirect-uri=http://localhost:8080/TripTogether/auth/naver/callback

# \u2500\u2500 Google OAuth2 \u2500\u2500
oauth.google.client-id=YOUR_GOOGLE_CLIENT_ID
oauth.google.client-secret=YOUR_GOOGLE_CLIENT_SECRET
oauth.google.redirect-uri=http://localhost:8080/TripTogether/auth/google/callback

# \u2500\u2500 Claude AI API \u2500\u2500
claude.api.key=YOUR_CLAUDE_API_KEY